# Lakehouse job: Bronze -> Silver -> Gold (serverless, runs on a schedule)
resources:
  jobs:
    medallion_pipeline:
      name: sentinelpay-medallion-pipeline
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/01_bronze.py
          environment_key: serverless
        - task_key: silver
          depends_on: [{ task_key: bronze }]
          notebook_task:
            notebook_path: ../notebooks/02_silver.py
          environment_key: serverless
        - task_key: gold
          depends_on: [{ task_key: silver }]
          notebook_task:
            notebook_path: ../notebooks/03_gold.py
          environment_key: serverless
      queue:
        enabled: true

environments:
  serverless:
    spec:
      client: "1"
