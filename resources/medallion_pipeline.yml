# Lakehouse job: landing volume -> Bronze -> Silver -> Gold (serverless).
# Started from the admin console (Data Pipeline → Run pipeline) or the Jobs UI.
resources:
  jobs:
    medallion_pipeline:
      name: sentinelpay-medallion-pipeline
      max_concurrent_runs: 1
      parameters:
        - { name: catalog, default: fraud }
        - { name: schema, default: analytics }
      tasks:
        - task_key: bronze
          notebook_task: { notebook_path: ../databricks/notebooks/01_bronze.py }
        - task_key: silver
          depends_on: [{ task_key: bronze }]
          notebook_task: { notebook_path: ../databricks/notebooks/02_silver.py }
        - task_key: gold
          depends_on: [{ task_key: silver }]
          notebook_task: { notebook_path: ../databricks/notebooks/03_gold.py }
      queue:
        enabled: true
